<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Khaled × Menna | Admin</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;color:#fff;min-height:100vh;background:radial-gradient(circle at top,#3b1629,#090609 55%)}.wrap{max-width:950px;margin:auto;padding:30px 16px}.card{background:#ffffff10;border:1px solid #ffffff1f;border-radius:24px;padding:28px;backdrop-filter:blur(18px)}.brand{text-align:center;color:#ff9fc4;font-weight:bold;line-height:1.9;margin-bottom:22px}.login{max-width:430px;margin:10vh auto}h1{font-size:28px;text-align:center}input{width:100%;padding:14px;margin-top:10px;border-radius:14px;border:1px solid #ffffff22;background:#0005;color:#fff;font:15px Tahoma}button{border:0;border-radius:999px;padding:13px 24px;margin-top:12px;color:#fff;background:linear-gradient(135deg,#ff4f91,#bd2b65);font-weight:bold;cursor:pointer}.muted{color:#bbaab3;line-height:1.8;font-size:13px}.error{color:#ff9fb7;margin-top:10px}.hide{display:none}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.count{color:#ff9fc4}.response{margin-top:18px;padding:18px;border:1px solid #ffffff18;border-radius:18px;background:#0004}.time{color:#9e8d95;font-size:12px;margin-bottom:13px}.q{color:#ff9fc4;font-size:14px;margin-bottom:7px}.a{white-space:pre-wrap;line-height:1.9;margin-bottom:15px}.empty{text-align:center;color:#bbaab3;padding:30px}
</style></head><body><div class="wrap">
<div id="login" class="card login"><div class="brand">خالد بيعشق هوا منة علي ❤️<br>خالد ملوش غير منة علي ❤️</div><h1>صفحة خالد السرية 🔐</h1><p class="muted">سجّل بحساب Supabase الخاص بالإدارة.</p><input id="email" type="email" placeholder="الإيميل"><input id="password" type="password" placeholder="كلمة السر"><button onclick="login()">دخول</button><div id="err" class="error"></div></div>
<div id="panel" class="card hide"><div class="brand">خالد بيعشق هوا منة علي ❤️<br>خالد ملوش غير منة علي ❤️</div><div class="top"><h1>إجابات اللعبة</h1><div id="count" class="count">0</div></div><button onclick="loadAnswers()">تحديث</button><button onclick="logout()" style="background:transparent;border:1px solid #ffffff33;margin-right:8px">خروج</button><div id="list"></div></div>
</div>
<script>
const SUPABASE_URL="https://crmsqwpcvzjnixwmneht.supabase.co",SUPABASE_ANON_KEY="sb_publishable_8V-oGZ9MtRn0xbubANBCxg_kMOc25tF";let token=null;
function $(x){return document.getElementById(x)}
async function login(){let r=await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_ANON_KEY},body:JSON.stringify({email:$("email").value,password:$("password").value})}),d=await r.json();if(!r.ok){$("err").textContent=d.error_description||"فشل تسجيل الدخول";return}token=d.access_token;$("login").classList.add("hide");$("panel").classList.remove("hide");loadAnswers()}
async function loadAnswers(){let r=await fetch(SUPABASE_URL+"/rest/v1/game_answers?select=*&order=created_at.desc",{headers:{"apikey":SUPABASE_ANON_KEY,"Authorization":"Bearer "+token}}),d=await r.json();if(!r.ok){$("list").innerHTML='<div class="error">'+(d.message||"خطأ")+"</div>";return}$("count").textContent=d.length+" إرسال";$("list").innerHTML=d.map(row=>'<div class="response"><div class="time">'+new Date(row.created_at).toLocaleString("ar-EG")+"</div>"+row.answers.map((a,i)=>'<div><div class="q">السؤال '+(i+1)+"</div><div class="a">"+esc(a)+"</div></div>").join("")+"</div>").join("")||'<div class="empty">مفيش إجابات لسه ❤️</div>'}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));}
function logout(){token=null;$("panel").classList.add("hide");$("login").classList.remove("hide")}
</script></body></html>
